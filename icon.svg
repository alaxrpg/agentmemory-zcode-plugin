<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#g)"/>
  <!-- Brain/memory chip -->
  <g transform="translate(28,28)" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chip body -->
    <rect x="2" y="10" width="68" height="52" rx="6"/>
    <!-- Pins left -->
    <line x1="2" y1="20" x2="-6" y2="20"/>
    <line x1="2" y1="32" x2="-6" y2="32"/>
    <line x1="2" y1="44" x2="-6" y2="44"/>
    <line x1="2" y1="52" x2="-6" y2="52"/>
    <!-- Pins right -->
    <line x1="70" y1="20" x2="78" y2="20"/>
    <line x1="70" y1="32" x2="78" y2="32"/>
    <line x1="70" y1="44" x2="78" y2="44"/>
    <line x1="70" y1="52" x2="78" y2="52"/>
    <!-- Brain waves -->
    <path d="M24 36 Q30 28 36 36 Q42 44 48 36"/>
    <path d="M28 44 Q34 38 40 44 Q46 50 52 44"/>
  </g>
  <!-- ZCode badge -->
  <circle cx="100" cy="100" r="20" fill="#18181b"/>
  <text x="100" y="106" text-anchor="middle" font-size="22" font-weight="900" fill="#a78bfa" font-family="monospace">Z</text>
</svg>
